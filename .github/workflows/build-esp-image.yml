name: build-esp-image

# 手动触发：把双引导器组装成可写盘的 FAT32 ESP 启动镜像
on:
  workflow_dispatch:
    inputs:
      root_uuid:
        description: "64 位根分区 ext4 UUID（占位即可，用于生成 grub.cfg）"
        required: true
        default: "00000000-0000-0000-0000-000000000000"
      root32_uuid:
        description: "32 位根分区 ext4 UUID（留空则不生成 32 位启动项）"
        required: false
        default: ""
      size_mib:
        description: "ESP 镜像大小（MiB）"
        required: true
        default: "512"

permissions:
  contents: read

jobs:
  esp:
    name: assemble dual-arch ESP image
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            grub2-common file dosfstools mtools ca-certificates
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            grub-efi-ia32-bin:i386 \
            grub-efi-amd64-bin:amd64

      - name: Build bootloaders
        run: bash scripts/build-bootloaders.sh out

      - name: Assemble ESP image
        run: |
          set -eux
          bash scripts/make-esp-image.sh \
            --out out/qm1-dual-boot.img \
            --size-mib "${{ inputs.size_mib }}" \
            --bootloaders out \
            --root-uuid "${{ inputs.root_uuid }}" \
            ${{ inputs.root32_uuid && format('--root32-uuid {0}', inputs.root32_uuid) || '' }}

      - name: Inspect image contents
        run: |
          set -eux
          mdir -i out/qm1-dual-boot.img -/ ::
          mdir -i out/qm1-dual-boot.img -/ ::/EFI/BOOT | tee esp-listing.txt
          # FAT 目录项在 mdir 里可能按 8.3 短名显示（空格补齐、大写），
          # 因此折叠空白并转小写后再匹配，避免把显示差异误判成失败。
          tr -s ' ' < esp-listing.txt | tr 'A-Z' 'a-z' > esp-norm.txt
          grep -q "bootia32" esp-norm.txt
          grep -q "bootx64"  esp-norm.txt
          grep -q "grub"     esp-norm.txt
      - name: Probe long filename support
        run: |
          # 探针：往副本里写一个超长文件名，看卷是否带长文件名表（LFN）。
          # 只报告，不作为失败条件 —— ESP 上的文件名已刻意采用 8.3 可精确表示的形式。
          cp out/qm1-dual-boot.img /tmp/probe.img
          printf 'probe' > /tmp/a-very-long-file-name.bin
          mcopy -i /tmp/probe.img /tmp/a-very-long-file-name.bin ::/a-very-long-file-name.bin || true
          if mdir -i /tmp/probe.img -/ :: | grep -qi "a-very-long-file-name"; then
            echo "长文件名表（LFN）：已启用"
          else
            echo "长文件名表（LFN）：未启用（8.3 短名）；ESP 文件名已按 8.3 安全形式设计，不受影响"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qm1-esp-image-${{ github.sha }}
          path: |
            out/qm1-dual-boot.img
            out/qm1-dual-boot.img.sha256
            out/grub2ia32.efi
            out/grubx64.efi
            out/SHA256SUMS
          if-no-files-found: error
